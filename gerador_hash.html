<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Gerador de Hash SHA-256</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; flex-direction: column; }
        div { padding: 20px; border: 1px solid #ccc; border-radius: 8px; }
        input { padding: 8px; width: 300px; margin-bottom: 10px; }
        button { padding: 10px; width: 100%; }
        textarea { width: 100%; height: 60px; margin-top: 10px; }
    </style>
</head>
<body>
    <div>
        <h2>Gerador de Hash Seguro (SHA-256)</h2>
        <input type="text" id="senha" placeholder="Digite sua nova senha aqui">
        <button onclick="gerarHash()">Gerar Hash</button>
        <textarea id="resultado" readonly placeholder="Seu hash seguro aparecerá aqui..."></textarea>
    </div>

    <script>
        async function gerarHash() {
            const senha = document.getElementById('senha').value;
            if (!senha) { alert('Digite uma senha.'); return; }
            const encoder = new TextEncoder();
            const data = encoder.encode(senha);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            document.getElementById('resultado').value = hashHex;
        }
    </script>
</body>
</html>
